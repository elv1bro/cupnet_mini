name: build

# Build the desktop app on each OS's own runner and attach the installers to a
# GitHub Release. Push a tag like v1.0.0 to cut a release, or run it by hand
# (workflow_dispatch) to get build artifacts without a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Go worker(s) for this platform
        shell: bash
        working-directory: azuretls-go
        run: |
          set -e
          mkdir -p bin
          L='-s -w'
          case "${{ matrix.platform }}" in
            mac)
              GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="$L" -o bin/azuretls-worker-darwin-amd64 .
              GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="$L" -o bin/azuretls-worker-darwin-arm64 . ;;
            linux)
              GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="$L" -o bin/azuretls-worker-linux-amd64 . ;;
            win)
              GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="$L" -o bin/azuretls-worker-win32-amd64.exe . ;;
          esac

      - name: Install dependencies
        run: npm install

      - name: Build desktop app
        run: npm run dist:${{ matrix.platform }}
        env:
          # No code signing in CI; produce unsigned builds.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cupnet-mini-${{ matrix.platform }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.exe
          if-no-files-found: warn

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.exe
